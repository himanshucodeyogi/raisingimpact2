<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="thumbTitle">
  <title id="thumbTitle">A generation of analytical donors is reshaping Indian giving. The evidence-led guidance they&#8217;re looking for hasn&#8217;t caught up. That&#8217;s why we started Raising Impact.</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2440" />
      <stop offset="55%" stop-color="#16304F" />
      <stop offset="100%" stop-color="#203C55" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#C09D4B" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#C09D4B" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#C09D4B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- soft gold glow, bottom right -->
  <circle cx="1105" cy="575" r="300" fill="url(#glow)" />

  <!-- top rule + kicker -->
  <rect x="90" y="92" width="72" height="4" rx="2" fill="#C09D4B" />
  <text x="90" y="142" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600"
        letter-spacing="3.4" fill="#D2B980">RAISING IMPACT &#183; BLOG</text>

  <!-- standfirst -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#FFFFFF">
    <tspan x="90" y="268">A generation of analytical donors is</tspan>
    <tspan x="90" y="334">reshaping Indian giving. The evidence-led</tspan>
    <tspan x="90" y="400">guidance they&#8217;re looking for hasn&#8217;t caught up.</tspan>
    <tspan x="90" y="472" fill="#D2B980">That&#8217;s why we started Raising Impact.</tspan>
  </text>

  <!-- bottom rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#FFFFFF" opacity="0.16" />
</svg>
