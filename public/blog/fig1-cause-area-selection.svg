<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="fig1Title">
  <title id="fig1Title">Cause-area selection matrix: six cause areas scored on sector maturity, existing funding, how enduring the problem is, and government alignment. Mental Health, Air Quality, Water and Food Systems and One Health cleared the shortlist; Early Childhood Care and Education and Income Enhancement cleared the full assessment.</title>

  <defs>
    <linearGradient id="f1navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2440" />
      <stop offset="100%" stop-color="#203C55" />
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="14" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.5" />

  <text x="60" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700"
        letter-spacing="3" fill="#C4973F">SIX CAUSE AREAS, FOUR CRITERIA</text>

  <!-- criteria chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#44546A" text-anchor="middle">
    <rect x="60" y="98" width="256" height="46" rx="23" fill="#F1F4F8" stroke="#DDE3EA" />
    <text x="188" y="127">Sector maturity</text>
    <rect x="334" y="98" width="256" height="46" rx="23" fill="#F1F4F8" stroke="#DDE3EA" />
    <text x="462" y="127">Existing funding</text>
    <rect x="608" y="98" width="256" height="46" rx="23" fill="#F1F4F8" stroke="#DDE3EA" />
    <text x="736" y="127">How enduring the problem is</text>
    <rect x="882" y="98" width="256" height="46" rx="23" fill="#F1F4F8" stroke="#DDE3EA" />
    <text x="1010" y="127">Government alignment</text>
  </g>

  <line x1="60" y1="180" x2="1140" y2="180" stroke="#E4E7EC" stroke-width="1.5" />

  <!-- row 1: cleared the shortlist -->
  <g>
    <rect x="60" y="212" width="344" height="168" rx="12" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.5" />
    <rect x="88" y="238" width="44" height="4" rx="2" fill="#DDE3EA" />
    <text x="88" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#0F2440">Mental Health</text>
    <rect x="88" y="328" width="181" height="34" rx="17" fill="#F1F4F8" />
    <text x="178" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#44546A" text-anchor="middle">Cleared the shortlist</text>

    <rect x="428" y="212" width="344" height="168" rx="12" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.5" />
    <rect x="456" y="238" width="44" height="4" rx="2" fill="#DDE3EA" />
    <text x="456" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#0F2440">Air Quality</text>
    <rect x="456" y="328" width="181" height="34" rx="17" fill="#F1F4F8" />
    <text x="546" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#44546A" text-anchor="middle">Cleared the shortlist</text>

    <rect x="796" y="212" width="344" height="168" rx="12" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.5" />
    <rect x="824" y="238" width="44" height="4" rx="2" fill="#DDE3EA" />
    <text x="824" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#0F2440">Water and Food Systems</text>
    <rect x="824" y="328" width="181" height="34" rx="17" fill="#F1F4F8" />
    <text x="914" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#44546A" text-anchor="middle">Cleared the shortlist</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="60" y="408" width="344" height="168" rx="12" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.5" />
    <rect x="88" y="434" width="44" height="4" rx="2" fill="#DDE3EA" />
    <text x="88" y="476" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#0F2440">One Health</text>
    <rect x="88" y="524" width="181" height="34" rx="17" fill="#F1F4F8" />
    <text x="178" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#44546A" text-anchor="middle">Cleared the shortlist</text>

    <rect x="428" y="408" width="344" height="168" rx="12" fill="url(#f1navy)" />
    <rect x="456" y="434" width="44" height="4" rx="2" fill="#C09D4B" />
    <text x="456" y="476" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#FFFFFF">Early Childhood Care</text>
    <text x="456" y="506" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#FFFFFF">and Education</text>
    <rect x="456" y="524" width="225" height="34" rx="17" fill="rgba(255,255,255,0.10)" />
    <text x="568" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#D2B980" text-anchor="middle">Cleared the full assessment</text>

    <rect x="796" y="408" width="344" height="168" rx="12" fill="url(#f1navy)" />
    <rect x="824" y="434" width="44" height="4" rx="2" fill="#C09D4B" />
    <text x="824" y="476" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#FFFFFF">Income Enhancement</text>
    <text x="824" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#A9BBCE">for smallholder farmers</text>
    <rect x="824" y="524" width="225" height="34" rx="17" fill="rgba(255,255,255,0.10)" />
    <text x="936" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#D2B980" text-anchor="middle">Cleared the full assessment</text>
  </g>
</svg>
